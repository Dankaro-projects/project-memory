[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "project-memory-mcp"
version = "0.6.0b15"
description = "Local project memory for decisions, evidence and outcomes, with bounded MCP retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dankaro"}]
dependencies = []
keywords = ["mcp", "memory", "sqlite", "codex", "decisions"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/Dankaro-projects/project-memory"
Repository = "https://github.com/Dankaro-projects/project-memory"
Issues = "https://github.com/Dankaro-projects/project-memory/issues"

[project.scripts]
project-memory = "memory_module.cli:main"
project-memory-mcp = "memory_module.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["memory_module"]

[tool.hatch.build.targets.sdist]
only-include = [
    "memory_module",
    "tests",
    "examples",
    "scripts",
    "docs/agents.md",
    "docs/control-panel.md",
    "docs/evidence.md",
    "docs/record-fields.md",
    "docs/releasing.md",
    "docs/setup.md",
    "docs/user-guide.md",
    "README.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.sqlite", "**/*.jsonl", "**/results", "**/.codex", "**/.memory"]
